<div class="auth-container">
  <div class="branding-section">
    <h1>Deadline Tracker</h1>
    <p>Keep your college applications on track, always.</p>
  </div>
  <div class="form-section">
    <mat-card class="auth-card">
      <mat-card-header>
        <mat-card-title>
          <span *ngIf="!isRegisterMode">Login</span>
          <span *ngIf="isRegisterMode">Register</span>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
          <!-- Email -->
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" required />
            <mat-error *ngIf="authForm.controls['email'].invalid && authForm.controls['email'].touched">
              Please enter a valid email.
            </mat-error>
          </mat-form-field>

          <mat-form-field  *ngIf="isRegisterMode" appearance="outline">
            <mat-label>Full Name</mat-label>
            <input matInput type="text" formControlName="fullName" required />
            <mat-error *ngIf="authForm.controls['fullName'].invalid && authForm.controls['fullName'].touched">
              Full name is required.
            </mat-error>
          </mat-form-field> 

          <!-- Password -->
          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" required />
            <mat-error *ngIf="authForm.controls['password'].invalid && authForm.controls['password'].touched">
              Password is required.
            </mat-error>
          </mat-form-field>
            
          <!-- Additional Fields for Register -->
            <mat-form-field *ngIf="isRegisterMode" appearance="outline">
              <mat-label>Confirm Password</mat-label>
              <input matInput type="password" formControlName="confirmPassword" required />
              <mat-error *ngIf="authForm.controls['confirmPassword'].invalid && authForm.controls['confirmPassword'].touched">
                Passwords must match.
              </mat-error>
            </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="authForm.invalid">
            <span *ngIf="!isRegisterMode">Login</span>
            <span *ngIf="isRegisterMode">Register</span>
          </button>
        </form>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button (click)="toggleMode()">
          <span *ngIf="!isRegisterMode">Don't have an account? Register</span>
          <span *ngIf="isRegisterMode">Already have an account? Login</span>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
