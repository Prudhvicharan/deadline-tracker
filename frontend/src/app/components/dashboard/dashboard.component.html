<mat-sidenav-container class="dashboard-container">
  <!-- Sidebar -->
  <mat-sidenav
    #drawer
    mode="side"
    opened="true"
    [class.collapsed]="isSidebarCollapsed"
    class="sidebar"
  >
    <div [class.collapsed]="isSidebarCollapsed" class="sidebar-header">
      <div class="logo">
        <img src="assets/logo.png" alt="Logo" />
      </div>
      <button mat-icon-button class="toggle-btn" (click)="toggleSidebar()">
        <mat-icon>{{ isSidebarCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      </button>
    </div>

    <mat-nav-list>
      <mat-list-item
        *ngFor="let item of navItems"
        [matTooltip]="isSidebarCollapsed ? item.label : ''"
        matTooltipPosition="right"
        class="nav-item"
        (click)="navigateTo(item.route)"
      >
        <mat-icon mat-list-icon>{{ item.icon }}</mat-icon>
        <span *ngIf="!isSidebarCollapsed">{{ item.label }}</span>
      </mat-list-item>
    </mat-nav-list>

    <div class="bottom-section">
      <mat-list-item class="bottom-items" (click)="navigateTo('profile')" [matTooltip]="isSidebarCollapsed ? 'Profile' : ''" matTooltipPosition="right">
        <mat-icon mat-list-icon>account_circle</mat-icon>
        <span *ngIf="!isSidebarCollapsed">Profile</span>
      </mat-list-item>
      <mat-list-item class="bottom-items" (click)="logout()" [matTooltip]="isSidebarCollapsed ? 'Logout' : ''" matTooltipPosition="right">
        <mat-icon mat-list-icon>logout</mat-icon>
        <span *ngIf="!isSidebarCollapsed">Logout</span>
      </mat-list-item>
    </div>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="dashboard-content">
    <!-- <div *ngIf="showDashboard">
      <app-dashboard></app-dashboard>
    </div> -->
    <div *ngIf="showColleges">
      <app-college-list></app-college-list>
    </div>
    <div *ngIf="showMyColleges">
      <app-user-colleges></app-user-colleges>
    </div>
    <div *ngIf="showDeadlines">
      <app-deadline-display></app-deadline-display>
    </div>
    <div *ngIf="showProfile">
      <app-profile></app-profile>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
