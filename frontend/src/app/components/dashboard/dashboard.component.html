<mat-toolbar color="primary" class="navbar">
  <span class="logo">Deadline Tracker</span>
  <span class="spacer"></span>
  <span>Welcome, {{ currentUser.username }}</span>
  <button mat-icon-button aria-label="Notifications">
    <mat-icon>notifications</mat-icon>
  </button>
  <button mat-icon-button routerLink="/profile" aria-label="Profile">
    <mat-icon>account_circle</mat-icon>
  </button>
  <button mat-raised-button color="warn" (click)="logout()">Logout</button>
</mat-toolbar>

<mat-sidenav-container class="dashboard-container">
  <!-- <mat-sidenav #drawer mode="side" opened="true" [mode]="isSmallScreen ? 'over' : 'side'" (openedChange)="onSidenavToggle($event)"> -->
  <mat-sidenav #drawer mode="side" opened="true" [mode]="isSmallScreen ? 'over' : 'side'">

    <mat-nav-list>
      <mat-list-item (click)="navigateTo('dashboard')">Dashboard</mat-list-item>
      <mat-list-item (click)="navigateTo('colleges')">View All Colleges</mat-list-item>
      <mat-list-item (click)="navigateTo('my-colleges')">My College List</mat-list-item>
      <mat-list-item (click)="navigateTo('deadlines')">All Deadlines</mat-list-item>
      <mat-list-item (click)="navigateTo('profile')">Profile</mat-list-item>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="dashboard-content">

      <div *ngIf="showCollegePrograms">
        <!-- programs offered by each college -->
        <app-program-details></app-program-details>
      </div>
  
      <div *ngIf="showColleges">
         <!-- all college content -->
        <app-college-list></app-college-list>
      </div>
  
      <div *ngIf="showMyColleges">
        <!-- all college content -->
       <app-user-colleges></app-user-colleges>
     </div>

      <div *ngIf="showDeadlines">
