<mat-sidenav-container class="dashboard-container">
  <!-- Sidebar -->
  <mat-sidenav
    #drawer
    mode="side"
    opened="true"
    [class.collapsed]="isSidebarCollapsed"
    class="sidebar"
  >
    <div [class.collapsed]="isSidebarCollapsed" class="sidebar-header">
      <div class="logo">
        <img src="assets/logo.png" alt="Logo" />
      </div>
      <button mat-icon-button class="toggle-btn" (click)="toggleSidebar()">
        <mat-icon>{{ isSidebarCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      </button>
    </div>

    <mat-nav-list>
      <mat-list-item
        *ngFor="let item of navItems"
        [matTooltip]="isSidebarCollapsed ? item.label : ''"
        matTooltipPosition="right"
        class="nav-item"
        (click)="selectSidebarItem(item.route)"
      >
        <mat-icon mat-list-icon>{{ item.icon }}</mat-icon>
        <span *ngIf="!isSidebarCollapsed">{{ item.label }}</span>
      </mat-list-item>
    </mat-nav-list>

    <div class="bottom-section">
      <mat-list-item
        (click)="selectSidebarItem('profile')"
        [matTooltip]="isSidebarCollapsed ? 'Profile' : ''"
        matTooltipPosition="right"
      >
        <mat-icon mat-list-icon>account_circle</mat-icon>
        <span *ngIf="!isSidebarCollapsed">Profile</span>
      </mat-list-item>
      <mat-list-item
        (click)="logout()"
        [matTooltip]="isSidebarCollapsed ? 'Logout' : ''"
        matTooltipPosition="right"
      >
        <mat-icon mat-list-icon>logout</mat-icon>
        <span *ngIf="!isSidebarCollapsed">Logout</span>
      </mat-list-item>
    </div>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="dashboard-content">
    <div class="intro-container" *ngIf="!selectedSidebarItem">
      <div class="welcome-card">
        <img src="assets/welcome-illustration.png" alt="Welcome" class="welcome-image" />
        <h1>Welcome to the Deadline Tracker!</h1>
        <p>
          Stay on top of your academic and professional goals. Track your deadlines, organize your tasks, and never miss a critical date.
        </p>
        <div class="actions">
          <button mat-raised-button color="primary" (click)="selectSidebarItem('colleges')">
            Add Colleges
          </button>
          <button mat-raised-button color="accent" (click)="selectSidebarItem('deadlines')">
            Add Deadlines
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="selectedSidebarItem === 'colleges'">
      <app-college-list></app-college-list>
    </div>
    <div *ngIf="selectedSidebarItem === 'deadlines'">
      <app-deadline-display></app-deadline-display>
    </div>
    <div *ngIf="selectedSidebarItem === 'my-colleges'">
      <app-user-colleges></app-user-colleges>
    </div>
    <div *ngIf="selectedSidebarItem === 'profile'">
      <app-user-profile></app-user-profile>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
